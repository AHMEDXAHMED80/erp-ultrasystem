spring:
  application:
    name: erp-ultrasystem
  datasource:
    url: jdbc:postgresql://localhost:5434/erp_ultrasystem
    driver-class-name: org.postgresql.Driver
    username: erp_user
    password: erp_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/erp-ultrasystem

server:
  port: 8080
