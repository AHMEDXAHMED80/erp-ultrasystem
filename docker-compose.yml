version: '3.9'

services:

  # ----------------------------------------------------------------
  # PostgreSQL — ERP main database
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_DB: erp_ultrasystem
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_ultrasystem"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # PostgreSQL — Keycloak own database (separate from ERP)
  # ----------------------------------------------------------------
  postgres-keycloak:
    image: postgres:16
    container_name: erp-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # pgAdmin — UI for both databases
  # ----------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ultrasystem.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - erp-network
    depends_on:
      - postgres
      - postgres-keycloak

  # ----------------------------------------------------------------
  # Keycloak — auth server (generates and manages JWT tokens)
  # ----------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: erp-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost
    ports:
      - "8180:8080"
    networks:
      - erp-network
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  # ----------------------------------------------------------------
  # Kafka — KRaft mode (no Zookeeper needed)
  # ----------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: erp-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------------
  # Kafka UI — visual UI to monitor Kafka topics and messages
  # ----------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: erp-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: erp-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    networks:
      - erp-network
    depends_on:
      - kafka

  # ----------------------------------------------------------------
  # Redis — idempotency store + caching
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    command: redis-server --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # RabbitMQ — message broker with management UI
  # ----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: erp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: erp_user
      RABBITMQ_DEFAULT_PASS: erp_password
    ports:
      - "5672:5672"     # AMQP port (your app connects here)
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # Mailhog — fake email server for local dev
  # (password reset, notifications, payslip emails etc.)
  # ----------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: erp-mailhog
    ports:
      - "1025:1025"   # SMTP port (your app sends emails here)
      - "8025:8025"   # Web UI to see emails
    networks:
      - erp-network

# ----------------------------------------------------------------
# Volumes — persist data across container restarts
# ----------------------------------------------------------------
volumes:
  postgres_data:
  postgres_keycloak_data:
  pgadmin_data:
  kafka_data:
  redis_data:
  rabbitmq_data:

# ----------------------------------------------------------------
# Network — all services talk to each other on this network
# ----------------------------------------------------------------

networks:
  erp-network:
    driver: bridge
